name: Trigger Claude Code

on:
  workflow_dispatch:
    inputs:
      repo_name:
        required: true
        description: "The name of the repo to pull code from"
      command:
        required: true
        description: "The command to run"

permissions:
  contents: write
  packages: write

jobs:
  claude-generic:
    env:
      GITHUB_TOKEN: ${{ secrets.PORT_GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PORT_GITHUB_TOKEN }}
          repository: ${{ inputs.repo_name }}
          ref: main

      - name: Configure Git
        run: |
          git config --global user.name "Claude Code Bot"
          git config --global user.email "claude-bot@jbaruch.com"

      - name: Execute Claude Code
        id: claude_execution
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: "Bash,Edit,Write,GlobTool,GrepTool,BatchTool"
          system_prompt: |
            You are a senior software engineer. Focus on security, performance, and maintainability.
            You will receive a repository and a command. Follow the instructions and open a PR if relevant.
            Do NOT make any changes directly to main EVER, only through a PR via a new branch.
          prompt: ${{ inputs.command }}
